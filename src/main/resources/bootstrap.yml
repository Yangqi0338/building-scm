spring:
  application:
    name: scm
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        group: ${nacos.discovery.group:DEFAULT_GROUP}
        server-addr: ${nacos.addr:124.70.145.191:8848}
        namespace: ${nacos.namespace:platform-service}
      config:
        server-addr: ${nacos.addr:124.70.145.191:8848}
        namespace: ${nacos.namespace:platform-service}
        file-extension: yml
        group: ${nacos.config.group:DEFAULT_GROUP}
        shared-configs:
          - data-id: platform-db.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: platform-thirdParty.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: platform-web.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: platform-share-config.yml
            group: DEFAULT_GROUP
            refresh: true

server:
  port: 9001
